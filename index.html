<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank of Albion</title>
    <link rel="icon" type="image/svg+xml" href="logo-placeholder.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="top-nav" aria-label="Primary">
        <a class="brand" href="#" aria-label="Bank of Albion home">
          <img src="logo-placeholder.svg" alt="Bank of Albion logo placeholder" />
          <span>Bank of Albion</span>
        </a>

        <ul class="menu-links">
          <li><a href="#">Modules</a></li>
          <li><a href="#">Pricing</a></li>
        </ul>

        <a class="login-btn" href="#">Login</a>
      </nav>
    </header>

    <main class="hero">
      <p class="version-pill">Bank of Albion v1.0.0</p>

      <h1>The smartest way to manage Albion guilds directly through Discord!</h1>

      <p class="subtext">Elevate your experience with a Bank of Albion membership.</p>

      <div class="hero-actions">
        <a class="hero-login" href="#">Login</a>
        <a class="invite-btn" href="#" id="inviteButton">
          <img src="logo-placeholder.svg" alt="" aria-hidden="true" />
          <span>Invite Bank of Albion</span>
        </a>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
